# KEEP/DROP rules for the TTree -> RNTuple conversion, one per line:   KEEP|DROP [tree:]pattern     (tree defaults to Events)
# Everything is KEPT unless a DROP rule matches; rules apply in order and the LAST matching rule wins.
# Examples:   DROP HLT_*        DROP L1_*        DROP Events:Electron_dr03*        KEEP HLT_IsoMu24
# The 8 custom electron branches are protected and can never be dropped.
# A collection's counter (nTau, nPhoton, ...) is dropped automatically when all its members are dropped.

# --- production DROP table (approved by the user) ---
DROP HTXS_*
DROP Tau_*
DROP boostedTau_*
DROP Photon_*
DROP FsrPhoton_*
DROP IsoTrack_*
DROP LowPtElectron_*
DROP SoftActivityJet_*
DROP TauProd_*
DROP TauSpinner_*
DROP TrackGenJetAK4_*

# index branches that pointed into the dropped Photon / FsrPhoton collections
DROP Electron_photonIdx
DROP Electron_fsrPhotonIdx
DROP Muon_fsrPhotonIdx
