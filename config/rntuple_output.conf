# Output settings of the conversion (part of the toolchain digest: changing them marks converted files stale).
# COMPRESSION: ROOT compression setting = algorithm*100 + level (5xx = zstd; 512 = zstd level 12, the size plateau; 505 = ROOT default).
# TARGET_EVENTS: consecutive source files of a masspoint (sorted by timestamp dir, then job number N) are merged into outputs of about this many events.
COMPRESSION=512
TARGET_EVENTS=20000
